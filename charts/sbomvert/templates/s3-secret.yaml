# S3 credentials, read by the app and (when seaweedfs.enabled) by SeaweedFS itself.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3
type: Opaque
stringData:
  accessKey: {{ .Values.app.env.S3_ACCESS_KEY_ID | quote }}
  secretKey: {{ .Values.app.env.S3_SECRET_ACCESS_KEY | quote }}
