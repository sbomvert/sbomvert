services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: nextjs-dev

    working_dir: /app

    volumes:
      # project files
      - ./:/app

      # node_modules isolation
      - /app/node_modules

      # docker daemon forwarding
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-sbomvert}:${POSTGRES_PASSWORD:-sbomvert}@postgres-dev:5432/${POSTGRES_DB:-sbomvert}

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
        required: false # only with the auth profile
    command: sh -c "npm install --force && npm run dev"

  redis:
    image: redis:8-alpine
    container_name: redis-dev

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  # Only for authentication (NEXT_PUBLIC_ENABLE_AUTH): docker compose --profile auth up
  postgres:
    profiles: [auth]
    container_name: postgres-dev
    image: postgres:18.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sbomvert}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sbomvert}
      - POSTGRES_DB=${POSTGRES_DB:-sbomvert}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  redis_data:
  postgres_data:
