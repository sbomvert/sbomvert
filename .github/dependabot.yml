version: 2

updates:
  # Root package plus its workspaces (packages/core, worker): one package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs-site:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]

  # Base images of Dockerfile, Dockerfile.dev and worker/Dockerfile. The scanner versions in
  # worker/Dockerfile (SYFT_VERSION, GRYPE_VERSION, TRIVY_VERSION, Docker Scout) are deliberately left
  # out: they change scan results, so they are only bumped by hand. Being build ARGs, Dependabot
  # doesn't see them anyway.
  - package-ecosystem: docker
    directories:
      - /
      - /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  # Images in docker-compose.yml (redis, seaweedfs).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: helm
    directory: /charts/sbomvert
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
