name: CI - Test & Analyze

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript

      - uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4

      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit summary
        run: |
          npm audit --json > audit.json || true
          cat audit.json

      - run: npm run lint
      - run: npm test
      - run: npm run build